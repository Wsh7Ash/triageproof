[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "triageproof"
version = "1.0.0"
description = "Canonicalise crash stacks, cluster by signature, dedupe reports and verify evidence bundles, plus 50 validated triage skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["triage", "crash", "dedupe", "evidence", "bug-bounty", "skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triageproof = "triageproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
